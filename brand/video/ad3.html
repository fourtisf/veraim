<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Veraim: token launch</title>
<style>
@font-face{font-family:Geist;src:url(Geist-Variable.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Geist Mono";src:url(GeistMono-Variable.woff2) format("woff2");font-weight:100 900}
:root{--b2:rgba(255,255,255,.1);--t1:#EDEDEF;--t2:#A0A0A8;--t3:#7E7E88;--gold:#E2CDA6;--gold2:#BFA57A;--hit:#4ADE9A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:Geist,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased;letter-spacing:-.02em}
.mono{font-family:"Geist Mono",monospace;letter-spacing:0}
#bg{position:absolute;inset:-60px;background:radial-gradient(900px 520px at 50% 0%,rgba(226,205,166,.13),transparent 70%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/96px 96px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/96px 96px;-webkit-mask-image:radial-gradient(1100px 760px at 50% 40%,#000 30%,transparent 100%)}
#glow{position:absolute;width:1400px;height:1400px;left:260px;top:-160px;border-radius:50%;background:radial-gradient(closest-side,rgba(226,205,166,.2),transparent);opacity:0}
.scene{position:absolute;inset:0;opacity:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.w{display:inline-block}
.big{font-size:108px;font-weight:600;letter-spacing:-.045em;line-height:1.04}
.pill{display:inline-flex;align-items:center;gap:12px;height:62px;padding:0 28px;border-radius:999px;font-size:26px;color:var(--t2);background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--b2)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--hit);box-shadow:0 0 18px var(--hit)}
#count{font-family:"Geist Mono",monospace;font-size:360px;font-weight:500;color:var(--t1);letter-spacing:-.04em}
.coin{position:relative;width:420px;height:420px;border-radius:50%;background:conic-gradient(from 200deg,#8a7650,#F4E6CC,#BFA57A,#6f5f3e,#E2CDA6,#8a7650);padding:14px;box-shadow:0 0 120px rgba(226,205,166,.35),0 40px 100px rgba(0,0,0,.7)}
.coin .face{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 25%,#1a1a1e,#050506 70%);display:grid;place-items:center;overflow:hidden;position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.coin .shine{position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%)}
.agent{display:flex;align-items:center;gap:16px;height:84px;padding:0 30px 0 18px;border-radius:22px;background:linear-gradient(180deg,#111114,#0A0A0C);box-shadow:inset 0 0 0 1px var(--b2);font-size:28px;font-weight:500}
.vl{width:52px;height:52px;border-radius:14px;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);display:grid;place-items:center}
</style>
</head>
<body>
<div id="bg"></div><div id="glow"></div>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="mk" viewBox="0 0 120 120"><path d="M22 20 L49 70 M98 20 L71 70" fill="none" stroke="#EDEDEF" stroke-width="20" stroke-linecap="round"/><circle cx="60" cy="96" r="13" fill="#EDEDEF"/></symbol></defs></svg>

<!-- 1 countdown -->
<div class="scene center" id="s1">
  <div id="count">3</div>
  <div id="live" style="display:flex;align-items:center;gap:26px;font-size:150px;font-weight:600;letter-spacing:-.05em;position:absolute"><span class="dot" style="width:40px;height:40px;box-shadow:0 0 50px var(--hit)"></span>LIVE</div>
</div>

<!-- 2 logo -->
<div class="scene center" id="s2">
  <div style="display:flex;align-items:center;gap:18px">
    <svg width="200" height="200" viewBox="0 0 120 120">
      <path id="p1" d="M22 20 L49 70" fill="none" stroke="#EDEDEF" stroke-width="20" stroke-linecap="round"/>
      <path id="p2" d="M98 20 L71 70" fill="none" stroke="#EDEDEF" stroke-width="20" stroke-linecap="round"/>
      <circle id="dot" cx="60" cy="96" r="13" fill="#EDEDEF"/>
    </svg>
    <div id="wmwrap" style="overflow:hidden;width:0"><div id="wm" style="font-size:176px;font-weight:600;letter-spacing:-.055em;white-space:nowrap;padding-right:10px">Veraim</div></div>
  </div>
  <div id="tag2" style="font-size:46px;color:var(--t2);margin-top:44px">The token is <span style="color:var(--t1)">live.</span></div>
</div>

<!-- 3 coin -->
<div class="scene" id="s3">
  <div style="display:flex;align-items:center;justify-content:center;gap:120px;height:100%">
    <div class="coin" id="coin"><div class="face"><svg width="210" height="210"><use href="#mk"/></svg><div class="shine" id="shine"></div></div></div>
    <div>
      <div id="t3a" class="mono" style="font-size:28px;color:var(--gold);letter-spacing:.12em">NOW LIVE</div>
      <div id="t3b" style="font-size:190px;font-weight:600;letter-spacing:-.055em;line-height:1;margin-top:18px">$VERAIM</div>
      <div id="t3c" style="font-size:44px;color:var(--t2);margin-top:26px">on Robinhood Chain</div>
      <div id="t3d" style="display:flex;gap:14px;margin-top:40px"><span class="pill"><span class="dot"></span>Trading now</span><span class="pill">Robinhood Chain</span></div>
    </div>
  </div>
</div>

<!-- 4 what it's behind -->
<div class="scene center" id="s4">
  <div class="big" id="t4" style="font-size:92px"><span class="w">The</span> <span class="w">token</span> <span class="w">behind</span> <span class="w">the</span> <span class="w">AI</span><br><span class="w">that</span> <span class="w">checks</span> <span class="w" style="color:var(--gold)">every</span> <span class="w" style="color:var(--gold)">token.</span></div>
  <div id="agents" style="display:flex;gap:16px;margin-top:70px">
    <div class="agent"><div class="vl"><svg width="28" height="28"><use href="#mk"/></svg></div>Safety</div>
    <div class="agent"><div class="vl"><svg width="28" height="28"><use href="#mk"/></svg></div>Dev</div>
    <div class="agent"><div class="vl"><svg width="28" height="28"><use href="#mk"/></svg></div>Whale</div>
    <div class="agent"><div class="vl"><svg width="28" height="28"><use href="#mk"/></svg></div>Research</div>
  </div>
</div>

<!-- 5 CTA -->
<div class="scene center" id="s5">
  <div id="ca" style="display:flex;align-items:center;gap:30px;height:150px;padding:0 60px;border-radius:40px;background:linear-gradient(180deg,#141417,#0A0A0C);box-shadow:inset 0 0 0 2px rgba(226,205,166,.5),0 0 90px rgba(226,205,166,.18)">
    <span class="mono" style="font-size:64px;color:var(--gold);font-weight:600">CA</span>
    <span style="width:2px;height:64px;background:rgba(226,205,166,.4)"></span>
    <span style="font-size:60px;font-weight:600;letter-spacing:-.03em">in the post</span>
  </div>
  <div id="t5" class="big" style="font-size:84px;margin-top:70px"><span class="w">Ask</span> <span class="w">before</span> <span class="w">you</span> <span class="w" style="color:var(--gold)">ape.</span></div>
  <div id="url5" style="margin-top:56px;display:flex;align-items:center;gap:26px">
    <div style="display:flex;align-items:center;gap:12px"><svg width="64" height="64"><use href="#mk"/></svg><span style="font-size:56px;font-weight:600;letter-spacing:-.05em">Veraim</span></div>
    <div style="height:74px;padding:0 38px;border-radius:20px;background:#EDEDEF;color:#000;display:flex;align-items:center;font-size:36px;font-weight:600">veraim.xyz</div>
  </div>
  <div id="nfa" class="mono" style="position:absolute;bottom:60px;font-size:18px;letter-spacing:.1em;color:var(--t3)">NOT FINANCIAL ADVICE · DYOR</div>
</div>

<svg width="1920" height="1080" style="position:absolute;inset:0;opacity:.06;pointer-events:none"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div id="flash" style="position:absolute;inset:0;background:#E2CDA6;opacity:0;mix-blend-mode:screen"></div>
<div id="fade" style="position:absolute;inset:0;background:#000;opacity:1"></div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3), eo5 = (x) => 1 - Math.pow(1 - x, 5);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;

const S = { s1: [0, 3.6], s2: [3.4, 7.6], s3: [7.4, 13.2], s4: [13.0, 17.2], s5: [17.0, 22.0] };
const DURATION = 22;
const alpha = (t, [a, b], fi = .4, fo = .45, last = false) => Math.min(eo(prog(t, a, a + fi)), last ? 1 : 1 - eio(prog(t, b - fo, b)));
function words(el, t, s, st = .07, d = .6) { [...el.querySelectorAll(".w")].forEach((w, i) => { const x = eo(prog(t, s + i * st, s + i * st + d)); w.style.opacity = x; w.style.transform = `translateY(${(1 - x) * 40}px)`; w.style.filter = `blur(${(1 - x) * 12}px)`; }); }
function show(el, t, s, d = .6, dy = 30) { const x = eo(prog(t, s, s + d)); el.style.opacity = x; el.style.transform = `translateY(${(1 - x) * dy}px)`; return x; }
function motion(el, t, [a, b]) { const x = prog(t, a, b), o = eio(prog(t, b - .45, b)); el.style.transform = `scale(${1 + x * .03}) translateY(${-o * 30}px)`; el.style.filter = o > 0 ? `blur(${o * 10}px)` : "none"; }

window.render = function (t) {
  $("fade").style.opacity = 1 - eo(prog(t, 0, .3)) + eio(prog(t, DURATION - .6, DURATION));
  $("bg").style.transform = `translate(${-t * 4}px,${-t * 2}px)`;

  // 1. countdown 3-2-1, then LIVE
  const s1 = $("s1"); s1.style.opacity = alpha(t, S.s1, .2, .4); motion(s1, t, S.s1);
  const k = Math.floor(t / .75); const kp = (t % .75) / .75;
  const c = $("count");
  if (t < 2.25) { c.style.display = "block"; c.textContent = 3 - k; c.style.opacity = 1 - eio(prog(kp, .6, 1)); c.style.transform = `scale(${lerp(1.25, .95, eo(kp))})`; c.style.filter = `blur(${(1 - eo(prog(kp, 0, .25))) * 10}px)`; }
  else c.style.display = "none";
  const lx = prog(t, 2.25, 2.6); $("live").style.opacity = eo(lx); $("live").style.transform = `scale(${lx > 0 ? back(lx) : .7})`;
  $("flash").style.opacity = .35 * (1 - prog(t, 2.25, 2.7)) * (t >= 2.25 ? 1 : 0) + .3 * (1 - prog(t, 7.45, 7.9)) * (t >= 7.45 ? 1 : 0);

  // 2. logo
  const s2 = $("s2"), t2 = S.s2[0]; s2.style.opacity = alpha(t, S.s2, .2, .5); motion(s2, t, S.s2);
  for (const [id, o] of [["p1", .2], ["p2", .3]]) { $(id).style.strokeDasharray = 57; $(id).style.strokeDashoffset = 57 * (1 - eio(prog(t, t2 + o, t2 + o + .7))); }
  const dx = prog(t, t2 + .95, t2 + 1.45); $("dot").style.transformOrigin = "60px 96px"; $("dot").style.transform = `translateY(${(1 - back(dx)) * -70}px) scale(${dx > 0 ? back(dx) : 0})`; $("dot").style.opacity = dx > 0 ? 1 : 0;
  const wx = eo5(prog(t, t2 + 1.5, t2 + 2.3)); $("wmwrap").style.width = wx * 600 + "px"; $("wm").style.transform = `translateX(${(1 - wx) * -60}px)`;
  show($("tag2"), t, t2 + 2.3, .8, 24);
  $("glow").style.opacity = .9 * Math.min(eo(prog(t, t2, t2 + 1.2)), 1 - eio(prog(t, S.s3[1] - .6, S.s3[1]))) + .5 * eo(prog(t, S.s5[0], S.s5[0] + 1.5));

  // 3. coin
  const s3 = $("s3"), t3 = S.s3[0]; s3.style.opacity = alpha(t, S.s3); motion(s3, t, S.s3);
  const cx = prog(t, t3 + .1, t3 + .9);
  $("coin").style.transform = `scale(${cx > 0 ? lerp(.6, 1, back(cx)) : .6}) rotateY(${(1 - eo(cx)) * 90}deg) translateY(${Math.sin(t * 1.6) * 8}px)`;
  $("coin").style.opacity = eo(cx);
  $("shine").style.transform = `translateX(${lerp(-60, 60, ((t - t3) * .45) % 1) * 1}%)`;
  show($("t3a"), t, t3 + .6, .5, 20);
  const bx = show($("t3b"), t, t3 + .8, .7, 40); $("t3b").style.letterSpacing = `${lerp(.05, -.055, eo(bx))}em`;
  show($("t3c"), t, t3 + 1.3, .6, 20); show($("t3d"), t, t3 + 1.7, .6, 20);

  // 4. what it's behind
  const s4 = $("s4"), t4 = S.s4[0]; s4.style.opacity = alpha(t, S.s4); motion(s4, t, S.s4);
  words($("t4"), t, t4 + .2, .07);
  [...$("agents").children].forEach((a, i) => show(a, t, t4 + 1.4 + i * .14, .5, 30));

  // 5. CTA
  const s5 = $("s5"), t5 = S.s5[0]; s5.style.opacity = alpha(t, S.s5, .5, .5, true);
  const ca = prog(t, t5 + .2, t5 + .8); $("ca").style.opacity = eo(ca); $("ca").style.transform = `scale(${ca > 0 ? lerp(.85, 1, back(ca)) : .85})`;
  $("ca").style.boxShadow = `inset 0 0 0 2px rgba(226,205,166,${.4 + .3 * Math.sin(t * 5) ** 2}),0 0 ${70 + 40 * Math.sin(t * 5) ** 2}px rgba(226,205,166,.2)`;
  words($("t5"), t, t5 + 1.0, .12, .7); show($("url5"), t, t5 + 1.9, .8, 24); show($("nfa"), t, t5 + 2.2, .8, 0);
};
window.DURATION = DURATION;
render(0);
</script>
</body>
</html>
