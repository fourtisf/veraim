# Nginx server block for Prova.
# 1. Replace prova.live with your domain on the server_name line below.
# 2. Copy to /etc/nginx/sites-available/prova and enable it (see DEPLOY.md).
# 3. Run Certbot: it adds the HTTPS (443) block and the http -> https redirect for you.

server {
    listen 80;
    listen [::]:80;
    server_name prova.live www.prova.live;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Real visitor IP, used by the waitlist rate limit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Agent runs can take up to ~2 minutes (live data + AI model).
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}

# Optional: send www to the bare domain. After Certbot has run, you can replace
# `server_name prova.live www.prova.live;` above with `server_name prova.live;`
# and add a separate server block that returns 301 https://prova.live$request_uri.
